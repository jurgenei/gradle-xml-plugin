plugins {
    id 'name.jurgenei.gradle.xml'
}

tasks.register('runXslt', name.jurgenei.gradle.xml.XsltTask) {
    style 'src/main/xslt/main.xsl'
    source 'src/main/xml/input.xml'
    outputDir.set(layout.buildDirectory.dir('out/xslt'))
    outputExtension.set('.xml')
    param 'prefix', 'Hello '
}

tasks.register('runXsltXir', name.jurgenei.gradle.xml.XsltTask) {
    style 'src/main/xslt/main.xsl'
    source 'src/main/xir/input.xir'
    outputDir.set(layout.buildDirectory.dir('out/xslt-xir'))
    outputExtension.set('.xir')
    xirFormat.set('beautified')
    param 'prefix', 'Hello '
}

tasks.register('runXsltIdentityXir', name.jurgenei.gradle.xml.XsltTask) {
    style 'src/main/xslt/identity.xir'
    source 'src/main/xir/identity-input.xir'
    outputDir.set(layout.buildDirectory.dir('out/xslt-identity'))
    outputExtension.set('.xir')
    xirFormat.set('beautified')
}

tasks.register('runSelfTest', name.jurgenei.gradle.xml.XSpecTask) {
    dependsOn 'runXslt', 'runXsltXir', 'runXsltIdentityXir'
    source 'src/main/xspec/selftest.xspec'
    outputDir.set(layout.buildDirectory.dir('reports/xspec'))
    failOnError.set(true)
}

tasks.register('verifySample') {
    dependsOn 'runSelfTest'
}
