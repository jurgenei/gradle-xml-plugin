plugins {
    id 'name.jurgenei.gradle.xml'
}

tasks.register('runXslt', name.jurgenei.gradle.xml.XsltTask) {
    style 'src/main/xslt/main.xsl'
    source 'src/main/xml/input.xml'
    outputDir.set(layout.buildDirectory.dir('out/xslt'))
    outputExtension.set('.xml')
    param 'prefix', 'Hello '
}

tasks.register('runXsltXir', name.jurgenei.gradle.xml.XsltTask) {
    style 'src/main/xslt/main.xsl'
    source 'src/main/xir/input.xir'
    outputDir.set(layout.buildDirectory.dir('out/xslt-xir'))
    outputExtension.set('.xir')
    xirFormat.set('beautified')
    param 'prefix', 'Hello '
}

tasks.register('verifySample') {
    dependsOn 'runXslt', 'runXsltXir'
    doLast {
        File xmlOutput = file('build/out/xslt/input.xml')
        File xirOutput = file('build/out/xslt-xir/input.xir')
        if (!xmlOutput.exists()) {
            throw new GradleException("Expected output file does not exist: ${xmlOutput}")
        }
        if (!xirOutput.exists()) {
            throw new GradleException("Expected output file does not exist: ${xirOutput}")
        }
        String text = xirOutput.getText('UTF-8')
        if (!text.contains('(result') || !text.contains('"Hello "') || !text.contains('"Gradle"')) {
            throw new GradleException("Unexpected XIR output: ${xirOutput}")
        }
    }
}
