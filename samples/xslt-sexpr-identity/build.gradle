plugins {
    id 'name.jurgenei.gradle.xml'
}

tasks.register('runXslt', name.jurgenei.gradle.xml.XsltTask) {
    style 'src/main/xslt/identity.sexpr'
    source 'src/main/sexpr/input.sexpr'
    outputDir.set(layout.buildDirectory.dir('out/xslt'))
    outputExtension.set('.sexpr')
    sexprFormat.set('beautified')
}

tasks.register('verifySample') {
    dependsOn 'runXslt'
    doLast {
        File output = file('build/out/xslt/input.sexpr')
        if (!output.exists()) {
            throw new GradleException("Expected output file does not exist: ${output}")
        }
        String text = output.getText('UTF-8')
        if (!text.contains('[id "b1"]') || !text.contains('(title "XML")')) {
            throw new GradleException("Unexpected S-expression output: ${output}")
        }
    }
}

