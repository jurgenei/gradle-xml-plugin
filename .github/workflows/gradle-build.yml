name: Build and Test

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '21' ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build, test, and verify samples
      run: |
        ./gradlew clean build --stacktrace
        ./gradlew -p samples/xslt-basic verifySample --stacktrace
        ./gradlew -p samples/xquery-basic verifySample --stacktrace
        ./gradlew -p samples/validation-basic verifySample --stacktrace
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: jurgenei/gradle-xml-plugin

    - name: Publish JUnit report
      if: always()
      uses: mikepenz/action-junit-report@v5
      with:
        report_paths: "**/build/test-results/test/TEST-*.xml"
        require_tests: true
        detailed_summary: true
